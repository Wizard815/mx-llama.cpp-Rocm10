name: mx-llamacpp          # pins the image namespace: mx-llamacpp-<service>

services:
  # Build-only: produces the llama.cpp image the ssh container is built FROM.
  # Behind a profile so a plain `up -d` never tries to run it.
  gfx906-base:
    profiles: ["build"]
    build:
      context: .
      dockerfile: gfx906-rocm10.Dockerfile
    image: mx-llama-rocm10-gfx906:local

  mx-llamacpp-ssh:
    build:
      context: .
      dockerfile: Dockerfile.mx-llamacpp-ssh
    image: mx-llamacpp-mx-llamacpp-ssh:latest      #
    container_name: mx-llamacpp-ssh
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "18"
    volumes:
      - ${ODYSSEUS_SSH_KEY:?set ODYSSEUS_SSH_KEY in .env}:/run/secrets/authorized_key:ro
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/app/models
    ports:
      - "2222:22"
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

    environment:
     - HUGGINGFACE_HUB_CACHE=/app/models/HFCache/hub
    networks:
#      - default
      - ai_net

networks:
#  default:
#    name: odysseus_default
#    external: true
  ai_net:
    external: true
