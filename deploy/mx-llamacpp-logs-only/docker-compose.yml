services:
  mx-llamacpp-ssh:
    build:
      context: .
      dockerfile: Dockerfile.mx-llamacpp-ssh
    container_name: mx-llamacpp-ssh
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "18"
    volumes:
      - ${ODYSSEUS_SSH_KEY:?set ODYSSEUS_SSH_KEY in .env}:/run/secrets/authorized_key:ro
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/app/models
      # NEW: persistent llama-server logs, readable from the host without
      # needing docker logs (host path: ${LLAMACPP_APPDATA}/logs/llama-server.log):
      - ${LLAMACPP_APPDATA:?set LLAMACPP_APPDATA in .env}/logs:/app/logs
    ports:
      - "2222:22"
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

    environment:
     - HUGGINGFACE_HUB_CACHE=/app/models/HFCache/hub
     - ROCM_PATH=/opt/rocm
    networks:
      - ai_net

networks:
  ai_net:
    external: true
