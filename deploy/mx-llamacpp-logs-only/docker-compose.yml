services:
  mx-llamacpp-ssh:
    build:
      context: .
      dockerfile: Dockerfile.mx-llamacpp-ssh
    container_name: mx-llamacpp-ssh
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "18"
    volumes:
      - /mnt/user/appdata/odysseus/data/ssh/id_ed25519.pub:/run/secrets/authorized_key:ro
      - /mnt/user/OnePiece/HomeLab/LLMBin:/app/models
      # NEW: persistent llama-server logs, readable from the host without
      # needing docker logs:
      #   tail -f /mnt/user/appdata/mx-llamacpp/logs/llama-server.log
      - /mnt/user/appdata/mx-llamacpp/logs:/app/logs
    ports:
      - "2222:22"
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

    environment:
     - HUGGINGFACE_HUB_CACHE=/app/models/HFCache/hub
     - ROCM_PATH=/opt/rocm
    networks:
      - ai_net

networks:
  ai_net:
    external: true
