services:
  mx-llamacpp-gui:
    build:
      context: .
      dockerfile: Dockerfile.mx-llamacpp-swap
    image: mx-llamacpp-gui:local
    container_name: mx-llamacpp-gui
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "18"
    volumes:
      - /mnt/user/appdata/odysseus/data/ssh/id_ed25519.pub:/run/secrets/authorized_key:ro
      - /mnt/user/OnePiece/HomeLab/LLMBin:/app/models
      - /mnt/user/appdata/mx-llamacpp/config.yaml:/app/config.yaml:ro
      - /mnt/user/appdata/mx-llamacpp/config.d:/app/config.d
      - /mnt/user/appdata/mx-llamacpp/logs:/app/logs
    ports:
      - "2222:22"
      - "8643:8080"    # llama-swap GUI  ->  http://192.168.20.5:8643/ui
      - "8000:8000"    # stayed open for a hand-run llama-server
      - "8001:8001"
      - "8002:8002"
    environment:
      - HUGGINGFACE_HUB_CACHE=/app/models/HFCache/hub
      - ROCM_PATH=/opt/rocm
      - HIP_PATH=/opt/rocm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ai_net

networks:
  ai_net:
    external: true
